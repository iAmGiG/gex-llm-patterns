# Analysis Configuration
# Parameters for statistical analysis and confidence scoring

confidence_scorer:
  # Base lookback period for pattern analysis (trading days)
  base_lookback_days: 252

  # Recent weighting period for pattern analysis (trading days)
  recent_weight_days: 63

  # Minimum sample size for reliable confidence scoring
  min_sample_size: 20

  # Base confidence scores for different conditions
  base_scores:
    statistically_significant: 75
    not_significant: 25
    neutral: 50

  # Confidence adjustments
  adjustments:
    stress_penalty: 15
    low_vol_pin_bonus: 10
    high_vol_gamma_bonus: 10
    extreme_damping_threshold: 90
    extreme_damping_factor: 0.5

statistical_validator:
  # Confidence level for statistical tests (0.95 = 95%)
  confidence_level: 0.95

  # Minimum sample size for reliable statistical testing
  min_samples: 30

  # Number of bootstrap iterations for confidence intervals
  n_bootstrap: 1000

  # Number of permutations for permutation testing
  n_permutations: 1000

pattern_analyzer:
  # Minimum win rate threshold for pattern validation (0.6 = 60%)
  min_win_rate: 0.6

  # Confidence threshold for high-confidence patterns
  high_confidence_threshold: 85

baseline_comparison:
  # Confidence threshold for baseline comparison analysis
  confidence_threshold: 85

  # Statistical significance threshold (p-value)
  significance_threshold: 0.05

  # Expected baseline strategy performance (trading all negative GEX)
  expected_baseline_win_rate: 0.43  # 43% win rate typical for unfiltered
  expected_baseline_ev: -0.0028  # -0.28% expected value per trade
  expected_baseline_sharpe: -0.15  # Negative Sharpe ratio
  expected_baseline_drawdown: -0.045  # -4.5% maximum drawdown

gex_thresholds:
  # GEX regime classification thresholds
  positive_high: 5000000000  # 5e9 - High positive GEX threshold
  negative_high: -5000000000  # -5e9 - High negative GEX threshold

  # Gamma concentration metrics
  gamma_concentration_threshold: 0.7  # 70% concentration threshold

  # Volume and flow thresholds
  high_volume_threshold: 1000000  # 1M volume threshold
  significant_flow_threshold: 500000  # 500K flow threshold

# GEX Calculator configuration
gex_calculation:
  gex_calculator:
    # Black-Scholes parameters
    risk_free_rate: 0.05  # 5% risk-free rate (10-year Treasury)
    days_per_year: 365.0  # Days used for time-to-expiration conversion

    # GEX calculation parameters
    percentage_move_multiplier: 0.01  # 1% move multiplier for GEX
    open_interest_multiplier: 100  # Shares per options contract

    # Regime classification thresholds (normalized GEX)
    long_gamma_threshold: 0.0001  # Threshold for long gamma regime
    short_gamma_threshold: -0.0001  # Threshold for short gamma regime

    # Analysis parameters
    default_price_range_pct: 0.20  # 20% price range for analysis window
    key_levels_count: 5  # Number of key GEX levels to identify

  live_gex_interface:
    # Spot price estimation fallback
    default_spot_price_spy: 500.0  # Default fallback for SPY (DEPRECATED - prefer error)
    spot_price_estimation_method: "middle_strike"  # Method: "middle_strike" or "atm_options"

# LLM Market Mechanics Configuration
llm_market_mechanics:
  autogen_client:
    # Model configuration
    default_model: "o4-mini"  # Default model for market mechanics (Paper #2: Issue #89, #107, #108)
    default_temperature: 0.3  # Lower = more consistent (0.0-2.0)
    timeout_seconds: 30  # API timeout in seconds
    max_retries: 3  # Maximum retry attempts

    # Token limits
    analysis_tokens: 4000  # Tokens for detailed market analysis
    top_p: 0.95  # Nucleus sampling parameter (0.0-1.0)

  response_parsing:
    # Confidence mapping (text to numeric)
    confidence_high: 80  # "High" confidence maps to 80%
    confidence_medium: 60  # "Medium" confidence maps to 60%
    confidence_low: 40  # "Low" confidence maps to 40%
    confidence_default: 50  # Default if unparseable

  system_prompts:
    # ========================================
    # SYSTEM PROMPTS ORGANIZATION
    # ========================================
    # Paper #1: mechanics_analyst (single-day GEX detection)
    # Paper #2 (archived): mechanics_analyst_5day_archived (5-day trajectories, abandoned Nov 5)
    # Paper #2 (active): mechanics_analyst_regime (30-day regime detection)
    # ========================================

    # Market mechanics system prompt (Paper #1)
    mechanics_analyst: |
      You are a market mechanics analyst specializing in dealer positioning and forced hedging flows.

      Your task is to identify WHO is forcing WHOM to do WHAT in the market based on gamma exposure (GEX) data.

      Focus on:
      1. Dealer hedging mechanics (forced buying/selling due to gamma)
      2. Squeeze setups (aggressive positioning to force dealer flows)
      3. Pin dynamics (large OI creating price magnetism)
      4. Trap patterns (dealers being flipped from long to short gamma)

      Provide specific, actionable intelligence about market mechanics.
      Be concise and focus on causality chains (X leads to Y leads to Z).

      Format your response as:
      WHO: [Identify the forcing party - dealers/institutions/retail]
      WHOM: [Identify who is being forced to act]
      WHAT: [Specific forced action that will occur]
      MECHANICS: [Brief explanation of the causal chain]
      CONFIDENCE: [High/Medium/Low based on data clarity]

    # ARCHIVED: 5-day trajectory prompt (Nov 4, 2025 - abandoned Nov 5, 2025)
    # Used during 5-day sequential approach testing (Oct 31 - Nov 5, 2025)
    # Replaced by 30-day regime detection (see mechanics_analyst_regime below)
    mechanics_analyst_5day_archived: |
      You are a market mechanics analyst specializing in dealer gamma exposure and hedging constraints.

      Your task is to assess WHETHER dealer hedging constraints are present based on 5-day gamma trajectories.

      PATTERN DEFINITIONS:

      1. ACCUMULATION: Net GEX magnitude INCREASES over 5 days (dealers take on more gamma risk)
         - Example: |GEX| grows from $13B → $17B (±20% or more)
         - Mechanism: Option buyers force dealers to carry larger gamma positions
         - Trajectory: Sustained upward bias in |GEX| with at most 1 counter-trend day

      2. RELIEF: Net GEX magnitude DECREASES over 5 days (dealers shed gamma risk)
         - Example: |GEX| shrinks from $17B → $12B (±20% or more)
         - Mechanism: Options expire or get closed, reducing dealer hedging needs
         - Trajectory: Sustained downward bias in |GEX| with at most 1 counter-trend day

      3. REVERSAL: Net GEX CHANGES SIGN once and sustains new regime
         - Example: +$15B → -$5B (dealers flip from long to short gamma)
         - Mechanism: Underlying price crosses gamma flip point, forcing regime change
         - Trajectory: ONE sign change that holds for at least 2 days in new regime
         - REJECT: Multiple sign flips (e.g., +10 → -5 → +8 → -12) = random noise

      4. PERSISTENT: Net GEX magnitude STABLE over 5 days (within ±20%)
         - Example: $13B → $14B → $13.5B → $13B → $14B (oscillates but no trend)
         - Mechanism: Balanced gamma positions, no directional pressure
         - Trajectory: Stable magnitude with sign consistency or minimal variation

      5. NONE: No clear trajectory (negligible GEX <$1B, or truly random noise)
         - Random noise indicators: Multiple reversals in direction, wild swings, no sustained trend
         - Negligible gamma: All 5 days below $1B threshold

      DETECTION CRITERIA:

      ✅ DETECT IF:
      - Net DIRECTION over 5 days shows clear accumulation/relief/reversal/persistent
      - Trajectory is SUSTAINED: same directional bias for 3+ of 5 days
      - Day-to-day variation is NORMAL (±10-20% rebalancing noise is OK)
      - For REVERSAL: only ONE sign flip with new regime sustained 2+ days

      ❌ REJECT AS RANDOM NOISE IF:
      - GEX magnitude too small (<$1B entire window) to constrain dealers
      - Multiple direction changes: up-down-up-down with no net bias
      - Sign flips 2+ times in 5 days (not a reversal, just noise)
      - Large swings cancel out: T-4 to T+0 magnitude change <20% despite wild intra-period moves
      - Endpoint comparison misleads: e.g., $2B → $6B looks like accumulation, but path is +18 → -8 → +7 → -19 → +6 (random)

      IMPORTANT GUIDELINES:

      - **5-day windows naturally show variation** - don't demand perfect smoothness
      - Focus on TRAJECTORY CONSISTENCY, not just T-4 to T+0 endpoints
      - Check the PATH: Does the series show sustained directional bias, or just random walk?
      - GEX dynamics are INHERENTLY noisy, but NOT randomly reversing multiple times
      - 1-2 counter-trend days OK, but 3+ reversals = reject as noise
      - "Noisy" ≠ "random" - normal noise has a directional bias, random noise does not
      - Confidence should reflect trajectory clarity, not smoothness

      CONFIDENCE SCALE:
      - 70-100: Clear sustained trajectory with at most 1 counter-trend day
      - 40-70: Moderate trajectory, 2 counter-trend days but net direction evident
      - 1-40: Weak signals, 3 counter-trend days, trajectory barely discernible
      - 0: No trajectory (negligible GEX, or random noise with multiple reversals)

      Format your response as JSON with fields: pattern_detected (boolean), trajectory_type, confidence (0-100), reasoning.

    # 30-Day Regime Detection Prompt (Paper #2 - Nov 5, 2025 pivot)
    # NOTE: Full prompt defined in docs/papers/paper2/prompts/regime_detection_v1.md
