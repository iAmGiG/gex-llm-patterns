# Analysis Configuration
# Parameters for statistical analysis and confidence scoring

confidence_scorer:
  # Base lookback period for pattern analysis (trading days)
  base_lookback_days: 252

  # Recent weighting period for pattern analysis (trading days)
  recent_weight_days: 63

  # Minimum sample size for reliable confidence scoring
  min_sample_size: 20

  # Base confidence scores for different conditions
  base_scores:
    statistically_significant: 75
    not_significant: 25
    neutral: 50

  # Confidence adjustments
  adjustments:
    stress_penalty: 15
    low_vol_pin_bonus: 10
    high_vol_gamma_bonus: 10
    extreme_damping_threshold: 90
    extreme_damping_factor: 0.5

statistical_validator:
  # Confidence level for statistical tests (0.95 = 95%)
  confidence_level: 0.95

  # Minimum sample size for reliable statistical testing
  min_samples: 30

  # Number of bootstrap iterations for confidence intervals
  n_bootstrap: 1000

  # Number of permutations for permutation testing
  n_permutations: 1000

pattern_analyzer:
  # Minimum win rate threshold for pattern validation (0.6 = 60%)
  min_win_rate: 0.6

  # Confidence threshold for high-confidence patterns
  high_confidence_threshold: 85

baseline_comparison:
  # Confidence threshold for baseline comparison analysis
  confidence_threshold: 85

  # Statistical significance threshold (p-value)
  significance_threshold: 0.05

  # Expected baseline strategy performance (trading all negative GEX)
  expected_baseline_win_rate: 0.43  # 43% win rate typical for unfiltered
  expected_baseline_ev: -0.0028  # -0.28% expected value per trade
  expected_baseline_sharpe: -0.15  # Negative Sharpe ratio
  expected_baseline_drawdown: -0.045  # -4.5% maximum drawdown

gex_thresholds:
  # GEX regime classification thresholds
  positive_high: 5000000000  # 5e9 - High positive GEX threshold
  negative_high: -5000000000  # -5e9 - High negative GEX threshold

  # Gamma concentration metrics
  gamma_concentration_threshold: 0.7  # 70% concentration threshold

  # Volume and flow thresholds
  high_volume_threshold: 1000000  # 1M volume threshold
  significant_flow_threshold: 500000  # 500K flow threshold

# Intra-day analysis configuration
intraday_analysis:
  # Key algo trading times (24-hour format)
  algo_times:
    market_open: "09:30:00"      # Market open
    algo_10am: "10:00:00"        # 10 AM algo updates
    fomc_230pm: "14:30:00"       # FOMC/Fed 2:30 PM (special days)
    gamma_330pm: "15:30:00"      # Gamma 3:30 PM (key validation time)
    gamma_340pm: "15:40:00"      # Gamma 3:40 PM
    gamma_350pm: "15:50:00"      # Gamma 3:50 PM
    market_close: "16:00:00"     # Market close
    extended_close: "16:15:00"   # Extended ETF close

  # Market session configuration
  market_session:
    start_time: "09:30:00"       # Regular session start
    end_time: "16:15:00"         # Extended session end
    timezone: "America/New_York" # Market timezone

  # Data collection intervals
  data_intervals:
    standard_interval: 10        # 10-minute snapshots
    high_frequency_interval: 1   # 1-minute for critical times

# Strike-level pattern detection configuration
strike_level_patterns:
  # Gamma concentration thresholds
  gamma_concentration:
    min_concentration_pct: 0.15    # 15% minimum concentration to detect
    high_concentration_pct: 0.20   # 20% for high-confidence signals
    max_distance_from_spot: 0.05   # 5% maximum distance from spot price

  # Volume anomaly detection
  volume_anomalies:
    base_threshold: 100000         # 100K contracts minimum
    multiplier_threshold: 3.0      # 3x average volume
    confidence_volume: 500000      # 500K for high confidence

  # Gamma walls detection
  gamma_walls:
    significance_threshold: 0.20   # 20% of total gamma
    min_strikes_required: 2        # Minimum strikes for wall
    proximity_range: 0.03          # 3% range around spot

  # Pin setup configuration (Issue #73 validated)
  pin_setup:
    base_probability_multiplier: 2.0     # Base concentration to probability
    friday_330pm_probability: 0.75       # Issue #73 validated success rate
    min_concentration_for_pin: 0.15      # 15% minimum for pin detection
    validated_setup_threshold: 0.15      # Threshold for validated Friday setup

  # Compound pattern thresholds
  compound_patterns:
    high_probability_pin:
      min_gamma_concentration: 0.20      # 20% gamma concentration required
      require_volume_anomaly: true       # Volume anomaly must be present
      require_friday_330pm: true         # Friday 3:30 PM timing required
      combined_confidence_cap: 0.95      # Maximum combined confidence

    volume_gamma_breakout:
      min_gamma_concentration: 0.15      # 15% gamma concentration
      require_gamma_walls: true          # Gamma resistance/support required
      base_confidence: 0.75               # Base confidence level