  gamma_concentration:
    min_concentration_pct: 0.15    # 15% minimum concentration to detect
    high_concentration_pct: 0.20   # 20% for high-confidence signals
    max_distance_from_spot: 0.05   # 5% maximum distance from spot price

  # Volume anomaly detection
  volume_anomalies:
