  batch_processor:
    # Batch LLM processing configuration
    default_batch_size: 5  # Trading days per batch (weekly)
    max_retries: 3  # Retry attempts for failed batches

  prompt_builder:
    # IV (Implied Volatility) percentile classification
    iv_thresholds:
      extremely_low: 12   # Below 12 VIX
      low: 15             # 12-15 VIX
      moderate: 20        # 15-20 VIX
      elevated: 25        # 20-25 VIX
      high: 35            # 25-35 VIX
      # Above 35 = extreme

# Validation configuration
validation:
  options_data_validator:
    # Put-call parity validation threshold
    put_call_parity_tolerance: 0.2  # Allow 20% deviation from theoretical delta difference

# Options Analysis Configuration
options_analysis:
  options_chain_analyzer:
    # Pattern detection thresholds
    signal_strength_threshold: 0.6  # Minimum signal strength for pattern detection (0-1)
    volume_oi_ratio_quantile: 0.8  # Quantile for unusual volume detection
    otm_put_threshold: 0.95  # OTM threshold as fraction of current price
    min_unusual_strikes: 3  # Minimum strikes for unusual activity pattern
    tight_spread_pct: 5.0  # Tight spread percentage threshold
    min_otm_put_activity: 3  # Minimum OTM puts for spread pattern
    summer_months: [6, 7, 8]  # June, July, August for seasonal patterns

# Intra-day analysis configuration
intraday_analysis:
