# Tokenization Configuration
# Parameters for GEX tokenization and sequence building

gex_tokenizer:
  # Days to look back for percentile calculation (trading year)
  lookback_days: 252

  # How often to update percentiles ('daily', 'weekly', 'monthly')
  update_frequency: "monthly"

  # Percentile thresholds for token generation
  percentile_thresholds: [10, 20, 30, 40, 50, 60, 70, 80, 90]

  # Minimum historical samples needed for reliable percentiles
  min_history_samples: 20

sequence_builder:
  # Maximum tokens per sequence (LLM context limit)
  max_sequence_length: 512

  # Default lookback period for building sequences (trading days)
  context_window_days: 20

  # Pattern mining sequence parameters
  pattern_length: 5
  target_horizon: 1
  stride: 1

  # Multi-timeframe analysis windows
  timeframes: [5, 10, 20]

  # Model-specific token limits
  model_token_limits:
    gpt-4o-mini: 4096
    gpt-4o: 8192
    gpt-3.5-turbo: 4096

price_tokenizer:
  # Return calculation window (trading days)
  return_window: 1

  # Volatility calculation window (trading days)
  volatility_window: 20

  # Annualization factor for volatility (trading days per year)
  trading_days_per_year: 252

event_tokenizer:
  # Volatility threshold for high volatility events
  high_vol_threshold: 30.0

  # Price distance threshold for pin detection (percentage)
  pin_distance_threshold: 0.5

  # Rolling window for realized volatility calculation
  realized_vol_window: 20