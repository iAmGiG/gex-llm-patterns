# Sample Data Test Configuration - Test baseline framework
# Uses sample data to validate baseline strategies without API dependencies

# Test Configuration
test_config:
  default_symbol: "SPY"
  default_start_date: "2024-01-01"
  default_end_date: "2024-01-31"  # Shorter test period
  account_size: 50000
  commission: 0.001
  slippage: 0.001

# Strategy Parameters - Only baseline strategies
strategies:
  raw_gex_baseline:
    name: "Raw Negative GEX"
    description: "Trade every negative GEX day mechanically"
    enabled: true
    position_sizing: 0.015

  technical_baseline:
    name: "Technical Indicators"
    description: "MACD + RSI weighted voting"
    enabled: true
    position_sizing: 0.015

  llm_strategy:
    name: "O3-mini LLM"
    description: "MarketMechanicsAgent with WHO/WHOM/WHAT analysis"
    enabled: false  # Disabled for sample data testing
    confidence_threshold: 75
    max_trades_per_test: 5

# Risk Management
risk_management:
  stop_loss_pct: 0.01
  profit_target_pct: 0.015
  max_holding_days: 2
  daily_loss_limit: 0.02

# Performance Targets
targets:
  minimum_viable:
    win_rate: 0.43
    expected_value: 0.0

  target_performance:
    win_rate: 0.60
    expected_value: 0.005
    sharpe_ratio: 1.0
    max_drawdown: 0.03

# Data Sources - Force sample data usage
data_sources:
  market_data:
    primary: "sample_data"
    fallback: "sample_data"
    use_cache: false  # Force fresh sample data

  options_data:
    primary: "sample_data"
    fallback: "sample_data"
    use_cache: false  # Force fresh sample data

# Output Configuration
output:
  save_detailed_results: true
  results_directory: "reports/baseline_comparison"
  include_metadata: true
  log_level: "INFO"