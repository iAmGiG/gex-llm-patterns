# Data Source Configuration
# Parameters for data collection and API clients

polygon_client:
  # Rate limiting for free tier (requests per minute)
  requests_per_minute: 5

  # Rate limiting timeout (seconds)
  rate_limit_timeout: 60

  # Request timeout (seconds)
  request_timeout: 30

  # Maximum retries for failed requests
  max_retries: 3

  # Retry delay (seconds)
  retry_delay: 1

alpha_vantage:
  # Rate limiting for free tier (requests per minute)
  requests_per_minute: 5

  # Request timeout (seconds)
  request_timeout: 30

  # Maximum retries
  max_retries: 3

historical_collector:
  # Batch size for historical data collection
  batch_size: 50

  # Maximum days to collect in a single batch
  max_days_per_batch: 30

  # Default data collection lookback (days)
  default_lookback_days: 252

  # Minimum open interest for options inclusion
  min_open_interest: 10

fed_data_integration:
  # Cache duration for Fed data (hours)
  cache_duration_hours: 24

  # FOMC meeting detection window (days)
  fomc_detection_window: 7

  # Economic data importance threshold
  importance_threshold: "high"