# GEX Calculation Configuration
# Parameters for gamma exposure calculations

gex_calculator:
  # Risk-free rate for Black-Scholes calculations (5% = 0.05)
  risk_free_rate: 0.05

  # Minimum time to expiration threshold (days)
  min_time_to_expiration: 1

  # Maximum time to expiration for calculations (days)
  max_time_to_expiration: 365

  # Default volatility for calculations when not available
  default_volatility: 0.25

  # Strike price filtering
  strike_filters:
    # Maximum percentage out-of-the-money to include
    max_otm_percentage: 0.50

    # Minimum open interest threshold
    min_open_interest: 10

greeks_calculator:
  # Numerical differentiation step size
  epsilon: 0.001

  # Maximum iterations for numerical convergence
  max_iterations: 100

  # Convergence tolerance
  tolerance: 1e-6

enhanced_pattern_detector:
  # GEX threshold for negative gamma regime detection
  negative_gex_threshold: -1000000000

  # Confidence threshold for GAMMA_TRAP pattern detection
  gamma_trap_confidence_threshold: 0.75

  # Maximum distance from flip point (percentage)
  max_flip_distance: 0.05

  # Minimum pattern strength for detection
  min_pattern_strength: 0.6