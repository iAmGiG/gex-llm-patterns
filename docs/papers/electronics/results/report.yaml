caveats:
- Windows have stride 1 and overlap; Wilson intervals in detection_by_year.csv are descriptive. Inference is in
  stats.yaml (quarter-block bootstrap and non-overlapping 30-day subsample next to every p-value).
- Rates are shares of parsed windows; parse failures are counted in n_windows but not in n.
- The fixed persistence/magnitude/flip thresholds are a pre-registered design decision; a scaled-threshold variant
  is a protocol change the authors must approve.
- 2026 windows are the post-publication period, not out-of-sample (gpt-6-luna was created 2026-09-14). post_publication_2026_summary.csv
  gives the rates for windows that end in 2026 and for those that lie entirely in 2026.
- call_only is derived from new_full.call_gex when the series table does not store it.
- 'Arm r1_o4mini in every table is the published result: the answers without detection_metadata recovered_2026 (1,412
  windows). r1_o4mini_all and bridge_incl_recovered add the 64 answers that only the 2026 backfill could read; the
  cost ledger and llm_parse_stats.csv cover every stored row. The backfilled Nov-2025 arms r1_p3_o4mini and r1_p4_o4mini
  follow the same rule (an ''_all'' variant exists only when some of their rows carry the flag).'
- Repeat arms ('<arm>#rep<k>') are compared only with their original arm (test_retest); the bridge gate uses the
  first pass.
- Spend in cost_ledger.* counts only runs for which common.counts_toward_budget holds (current model, not a backfill);
  the backfilled o4-mini runs are listed under budget.not_spend and are never added to the spend.
