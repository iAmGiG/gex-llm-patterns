notes:
- Pairs are windows parsed in both arms; the classifier label comes from the shared window.
- 'model_pair compares each open-weights arm (gpt-oss-20b: arms oss_<arm>; llama-3.1-8b-instruct: arms llama_<arm>;
  qwen3-8b: arms qwen_<arm>, decisions D-29 and D-30) with its gpt-6-luna twin <arm> on the same windows (reference
  = gpt-6-luna); the open-weights arms are compared with the published answers in bridge as well, for description,
  and never feed the gate.'
- bridge_incl_recovered repeats the comparison with the answers recovered in 2026 added to the reference (reference
  arm <arm>_all); the gate uses the published answers only.
- Only r1_o4mini on jan2026_phase4a feeds the gate; r1_p3_o4mini / r1_p4_o4mini (dated Nov-2025 prompts) are compared
  with the gpt-6-luna arms that read the same series, for description.
- test_retest compares an arm with its own repeated requests ('<arm>#rep<k>'); it is not part of the gate.
- Bootstrap intervals resample calendar quarters of window_end (see stats.yaml meta).
- rate_diff_pp = detection rate of the reference minus that of the other arm on the paired windows; p_mcnemar_exact
  is the exact McNemar test on the discordant counts (stride-1 windows treated as independent), p_boot the quarter-block
  bootstrap p-value of the same difference (all-years row only).
- 'median_ratio_ref / median_ratio_other: median of the model-reported mean |GEX| over the computed mean on the
  pairs (reported_vs_computed.csv has the full distribution).'
- kappa is null when one rater is constant and chance agreement is 1; the gate's met is then null.
