module: scripts/validation/electronics/unanswered_analyses.py
issue: 298
determinism: no resampling; the file holds no paths, clocks or run-specific values
parameters:
  focus_models:
  - qwen3-8b
  contested_definition: pivotal
  contested_sets:
    margin1:
      days: 1
      billions: 1.0
      flips: 1
      flips_below: 1
    pivotal:
      days: 1
      billions: 0.5
      flips: 1
      flips_below: 0
    narrow:
      days: 0
      billions: 0.5
      flips: 0
      flips_below: 0
    wide:
      days: 3
      billions: 2.0
      flips: 2
      flips_below: 2
  contested_function: stored_analyses.contested_mask
gates:
  final_rows_equal_report_detections: true
  census_equals_llm_parse_stats: true
  bounds_equal_missing_answer_bounds: true
  all_passed: true
reconciliation:
  census_vs_llm_parse_stats:
    n_differences: 0
    differences: []
    unanswered_all_arms: 1097
    unanswered_primary: 1035
    bounds_n_unparsed_total: 1035
  bounds_vs_missing_answer_bounds:
    rows_here: 39
    rows_stored: 39
    unmatched: 0
    max_abs_diff_lower_pct: 0.0
    max_abs_diff_upper_pct: 0.0
    count_mismatch: 0
  final_rows_vs_report_detections:
    final_rows_here: 89904
    rows_in_report: 89904
    only_here: 0
    only_in_report: 0
    run_id_differs: 0
    parsed_differs: 0
n_answer_rows: 101014
n_final_rows: 89904
scanner_on_answered_rows:
  n_answered_rows: 89856
  n_same_verdict: 88562
  n_scanner_no_verdict: 1294
  by_model:
    gpt-6-luna:
      n: 36333
      n_same: 36333
    gpt-oss-20b:
      n: 12382
      n_same: 12382
    gpt-oss-20b-t0:
      n: 1589
      n_same: 1589
    llama-3.1-8b-instruct:
      n: 12378
      n_same: 12378
    llama-3.1-8b-instruct-rf:
      n: 12378
      n_same: 12378
    llama-3.1-8b-instruct-t0:
      n: 1590
      n_same: 1590
    o4-mini:
      n: 446
      n_same: 154
    o4-mini-2025-04-16:
      n: 1476
      n_same: 474
    qwen3-8b:
      n: 11284
      n_same: 11284
files:
  unanswered_agreement_variants.csv:
    rows: 79
    description: agreement and kappa with the rule per arm and period when unanswered windows are dropped, counted
      as not detected, counted as errors, or filled with the recoverable verdict
    columns:
    - arm
    - model
    - series_key
    - symbol
    - period
    - n_windows
    - n_unanswered
    - n_recoverable
    - n_answered
    - agree_answered
    - agree_pct_answered
    - kappa_answered
    - n_unans_no
    - agree_unans_no
    - agree_pct_unans_no
    - kappa_unans_no
    - n_unans_error
    - agree_unans_error
    - agree_pct_unans_error
    - kappa_unans_error
    - n_rec
    - agree_rec
    - agree_pct_rec
    - kappa_rec
    - n_rec_error
    - agree_rec_error
    - agree_pct_rec_error
    - kappa_rec_error
    column_notes:
      arm: arm label as in detection_by_year.csv
      model: model name
      series_key: series the arm read
      period: calendar years of window_end
      n_windows: windows in the row
      n_answered: windows with a parsed answer
      agree_pct_answered: agreement with the rule over answered windows
      kappa_answered: kappa with the rule on answered windows
      agree_pct_unans_error: agreement over all windows, an unanswered window counted as wrong
  unanswered_answering_bands.csv:
    rows: 36
    description: answered share of the focus model by band of the rule's metrics, dominant sign, rule verdict and
      contested status
    columns:
    - model
    - scope
    - variable
    - band
    - n_windows
    - n_answered
    - answered_pct
    - n_rule_detect
    column_notes:
      model: model name
      n_windows: windows in the row
      n_answered: windows with a parsed answer
      answered_pct: share of windows with a parsed answer, percent
  unanswered_answering_logit.csv:
    rows: 12
    description: logistic regression of answering on the rule's metrics for the focus model (coefficients, odds
      ratios, auc)
    columns:
    - model
    - scope
    - term
    - coef
    - se
    - odds_ratio
    - auc
    - n
    - n_answered
    column_notes:
      model: model name
      n_answered: windows with a parsed answer
  unanswered_bounds_with_recoverable.csv:
    rows: 39
    description: missing_answer_bounds.csv with the recoverable verdicts added (lower_rec_pct, upper_rec_pct, widths)
    columns:
    - arm
    - model
    - series_key
    - symbol
    - period
    - n_windows
    - n_parsed
    - n_detected_parsed
    - rate_parsed_pct
    - n_unparsed
    - lower_pct
    - upper_pct
    - n_recoverable
    - n_recoverable_true
    - n_unrecoverable
    - lower_rec_pct
    - upper_rec_pct
    - rate_with_rec_pct
    - width_pp
    - width_rec_pp
    column_notes:
      arm: arm label as in detection_by_year.csv
      model: model name
      series_key: series the arm read
      period: calendar years of window_end
      n_windows: windows in the row
  unanswered_census_unanswered.csv:
    rows: 267
    description: final answers of every model and arm by kind (answered, missing, failed, complete_at_cap), finish
      reason, whether the request cap was reached and the rule's verdict
    columns:
    - model
    - arm
    - arm_role
    - request_cap
    - kind
    - finish_reason
    - cap_reached
    - rule
    - n
    column_notes:
      model: model name
      arm: arm label as in detection_by_year.csv
  unanswered_contested_agreement.csv:
    rows: 214
    description: agreement with the rule by stratum (all, contested, not_contested, contested_<criterion>) for every
      primary arm under the pivotal definition
    columns:
    - arm
    - model
    - series_key
    - symbol
    - stratum
    - n_windows
    - n_answered
    - answered_pct
    - n_rule_detect
    - agree_pct_answered
    - agree_pct_unans_error
    - kappa_answered
    column_notes:
      arm: arm label as in detection_by_year.csv
      model: model name
      series_key: series the arm read
      stratum: all, contested, not_contested or contested_<criterion>
      n_windows: windows in the row
      n_answered: windows with a parsed answer
      answered_pct: share of windows with a parsed answer, percent
      agree_pct_answered: agreement with the rule over answered windows
      agree_pct_unans_error: agreement over all windows, an unanswered window counted as wrong
      kappa_answered: kappa with the rule on answered windows
  unanswered_contested_sensitivity.csv:
    rows: 352
    description: the contested and not_contested strata under the margin sets pivotal (default), margin1, narrow
      and wide
    columns:
    - arm
    - model
    - series_key
    - symbol
    - stratum
    - n_windows
    - n_answered
    - answered_pct
    - n_rule_detect
    - agree_pct_answered
    - agree_pct_unans_error
    - kappa_answered
    - margin_set
    - margin_days
    - margin_billions
    - margin_flips_above
    - margin_flips_below
    - is_default
    column_notes:
      arm: arm label as in detection_by_year.csv
      model: model name
      series_key: series the arm read
      stratum: all, contested, not_contested or contested_<criterion>
      n_windows: windows in the row
      n_answered: windows with a parsed answer
      answered_pct: share of windows with a parsed answer, percent
      agree_pct_answered: agreement with the rule over answered windows
      agree_pct_unans_error: agreement over all windows, an unanswered window counted as wrong
      kappa_answered: kappa with the rule on answered windows
      margin_set: name of the contested-window margins
      is_default: true for the definition both papers quote
  unanswered_gpu_time.csv:
    rows: 6
    description: 'local GPU time per model: runs, GPUs, summed and union hours, concurrency'
    columns:
    - model
    - n_runs
    - n_gpus
    - seconds_sum
    - hours_sum
    - union_hours
    - gpu_busy_hours
    - max_engines_per_gpu
    - span_hours
    - max_concurrent
    - n_same_gpu_overlaps
    - seconds_vs_interval_max_abs
    column_notes:
      model: model name
  unanswered_gpu_time_runs.csv:
    rows: 156
    description: 'one row per local run: model, run_id, GPU, seconds, start and end (UTC)'
    columns:
    - model
    - run_id
    - gpu
    - seconds
    - started_at
    - completed_at
    column_notes:
      model: model name
  unanswered_recoverable_first_pass_vs_retry.csv:
    rows: 3
    description: 'windows whose cut first answer holds a verdict and whose retry answered: same verdict and agreement
      of each with the rule'
    columns:
    - model
    - n
    - n_same
    - n_first_agrees_rule
    - n_retry_agrees_rule
    column_notes:
      model: model name
  unanswered_recoverable_verdicts.csv:
    rows: 60
    description: verdicts that can be read out of unanswered answers (per population, model and arm) and their agreement
      with the rule
    columns:
    - population
    - model
    - arm
    - n_rows
    - n_with_text
    - n_verdict
    - n_verdict_true
    - n_verdict_false
    - n_cut_after_verdict
    - n_cut_before_verdict
    - n_complete
    - n_verdict_rule_detect
    - n_verdict_rule_reject
    - n_verdict_agrees_rule
    column_notes:
      model: model name
      arm: arm label as in detection_by_year.csv
  unanswered_repeat_stability.csv:
    rows: 45
    description: 'per model and base arm: windows answered in both passes, in one, in none, and the same-verdict
      share'
    columns:
    - model
    - base_arm
    - n_repeated
    - n_both
    - n_original_only
    - n_repeat_only
    - n_neither
    - n_one_pass_only
    - n_same_verdict
    - agree_pct
    - kappa
    column_notes:
      model: model name
      agree_pct: agreement with the rule in percent
      kappa: Cohen's kappa (null when undefined)
