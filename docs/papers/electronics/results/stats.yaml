meta:
  seed: 261
  n_boot: 2000
  bootstrap_exact_max_resamples: 200000
  ci_level: 0.95
  primary_label: regime_detected / clf_should_detect
  periods:
    '2024': window_end years 2024-2024
    '2025': window_end years 2025-2025
    2020-2023: window_end years 2020-2023
    2024-2025: window_end years 2024-2025
    2008-2019: window_end years 2008-2019
    '2026': window_end years 2026-2026
    all: every window
  wilson: Wilson score interval; treats stride-1 windows as independent, so it is too narrow
  bootstrap_quarter: resamples calendar quarters of window_end with replacement (paired contrasts resample the same
    quarters for both series); every distinct resample enumerated with its weight among the k**k equally likely
    draws when there are at most 200,000 (up to 10 quarters; for two independent periods the product of both), else
    2,000 seeded draws (method and n_draws per entry); percentile interval (numpy linear rule); p = 2 min(P(d<=0),
    P(d>=0)), bounded below by the probability of one resample (1/n_draws exact, 1/(draws+1) Monte Carlo); with
    few quarters the interval is coarse
  nonoverlap_30d: greedy chain of windows that share no day, from the first window of the period; rate_pct_range_over_starts
    is the min/max over the 30 possible first windows
  series_contrast: 'a minus b on windows present in both series; LLM contrasts hold the model fixed; family = series
    (data lineage), label (a: Day-T labels, b: the dates sent in Nov 2025, same values) or scale (a: OI-notional-scaled
    values, b: stored values)'
  period_shift: 2024-2025 minus 2020-2023 for one label source; phi is signed (late vs early)
  phase_contrast: Phase 3 (2024) minus Phase 4 (2020) for one kind of label source and model, unpaired (late = a,
    early = b); phi is signed
  headline_contrasts: 'the contrasts the text quotes: period shifts, Phase 3 vs 4, label and scale contrasts, and
    the series contrasts for 2024-2025'
